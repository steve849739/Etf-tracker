name: ETF 每日更新并发布

# 工作日(周一~周五)北京时间 09:30 自动运行一次；
# 交易所每日早 7 点才确保更新前一交易日公示数据，故安排在 7 点之后抓取(预留缓冲)；
# 也可在 GitHub Actions 页面手动触发「Run workflow」立即执行一次。
on:
  schedule:
    - cron: "30 1 * * 1-5"   # UTC 01:30 = 北京时间 09:30
  workflow_dispatch:

permissions:
  contents: write    # 回写 etf跟踪.xlsx / data/etf_data.json 到仓库
  pages: write       # 部署 GitHub Pages
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update:
    name: 抓取并更新数据
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取交易所数据并更新跟踪表
        run: python run_etf.py

      # 排查日志①：打印抓取结果摘要，一眼看出"数据更新到哪天"
      - name: 日志-数据摘要
        run: |
          python - <<'EOF'
          import json
          with open('data/etf_data.json', encoding='utf-8') as f:
              d = json.load(f)
          print('fetched_at:', d.get('fetched_at'), '| mode:', d.get('mode'))
          for f_ in d.get('funds', []):
              lt = f_.get('latest') or {}
              print('  [%s] %s 最新日期=%s 份额=%s' % (
                  f_.get('code'), f_.get('name'), lt.get('date'), lt.get('share')))
          EOF

      - name: 生成展示页面 dashboard/report.html
        run: python export_dashboard.py

      # 排查日志②：确认页面生成时间与明细完整性（export_dashboard.py 已输出每基金明细摘要）
      - name: 日志-页面生成结果
        run: |
          echo "generated_at: $(grep -o '数据生成时间：[^<]*' dashboard/report.html | head -1)"
          echo "页面大小: $(wc -c < dashboard/report.html) bytes"

      - name: 回写更新后的数据到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: 每日ETF数据更新 $(date -u +%F)"
          # 若并发 run 已先 push，先拉取合并（冲突保留本次最新抓取的数据）
          git pull --no-rebase -X ours origin main || true
          git push origin main

      # 注意：页面必须在同一个 job 内部署（不要拆成独立 job）——
      # 独立 job 的 checkout 检出的是触发 run 时的 commit，拿不到本 job 刚生成的新页面。
      - name: 生成 index.html（让根路径可访问）
        run: cp dashboard/report.html dashboard/index.html

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传页面产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: 部署到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
